appId: cr.educando.app
productName: Educando
directories:
  buildResources: build
# Solo el código compilado entra al .asar; ffmpeg, yt-dlp y los modelos van como extraResources.
# Ojo: los `files` de cada plataforma reemplazan a estos (no se suman), por eso se repiten allá.
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/onnxruntime-node/**
# ffmpeg, yt-dlp y el modelo de IA NO viajan en el instalador (pesan ~190 MB): la app los descarga la primera vez
# (ver src/main/components.ts). Para desarrollar se bajan con `npm run setup` a resources/ y no se empaquetan.
win:
  executableName: educando
  target:
    - nsis
  files:
    - out/**/*
    - package.json
    # onnxruntime-node trae los binarios de todos los sistemas: solo dejamos el de Windows x64.
    - '!node_modules/onnxruntime-node/bin/napi-v3/{darwin,linux}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/win32/arm64/**'
nsis:
  artifactName: Educando-${version}-instalador.${ext}
  shortcutName: Educando
  uninstallDisplayName: Educando
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  language: '3082'
linux:
  target:
    - AppImage
  category: Utility
  files:
    - out/**/*
    - package.json
    - '!node_modules/onnxruntime-node/bin/napi-v3/{darwin,win32}/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/arm64/**'
    # Las librerías de GPU (CUDA) pesan ~450 MB y no las usamos.
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime_providers_*'
appImage:
  artifactName: Educando-${version}.${ext}
npmRebuild: false
# Dónde se publican las versiones nuevas y de dónde las descarga la app instalada para actualizarse.
# Tiene que ser un repositorio PÚBLICO (la app instalada lo consulta sin ninguna clave): ver README.
publish:
  provider: github
  owner: Heutlett
  repo: easy-tools
  releaseType: release
