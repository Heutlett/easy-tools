name: Instalador de Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Para crear el release y subir el instalador en este mismo repositorio no hace falta ningún token propio.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # electron-builder publica en el release de la versión de package.json, no en el de la etiqueta: si no coinciden, pisaría
      # los archivos de otra versión. Mejor fallar antes de construir.
      - name: Revisar que la etiqueta coincida con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          file=$(node -p "require('fs').readFileSync('VERSION','utf8').trim()")
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "v$file" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión de package.json ($version) y de VERSION ($file). Súbela en ambos, haz commit y vuelve a crear la etiqueta."
            exit 1
          fi

      # electron-builder sube varios archivos a la vez y, si el release no existe, cada subida intenta crearlo y una falla con
      # "422 Published releases must have a valid tag". Creándolo antes, las subidas solo agregan archivos.
      - name: Crear el release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # La descripción es la entrada de esta versión en CHANGELOG.md
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p=index($0,"["v"]")>0; next} p' CHANGELOG.md)
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes "$notes"
        env:
          GH_TOKEN: ${{ github.token }}

      # Al subir una etiqueta (por ejemplo v0.2.0) se construye y se PUBLICA la versión para que las apps instaladas
      # se actualicen.
      - name: Construir y publicar
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ github.token }}

      # Sin etiqueta solo se construye el instalador (para probarlo), sin publicar nada
      - name: Construir sin publicar
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: educando-windows
          path: |
            dist/*.exe
            dist/latest.yml
