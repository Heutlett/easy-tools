name: Instalador de Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # electron-builder publica en el release de la versión de package.json, no en el de la etiqueta: si no coinciden, pisaría
      # los archivos de otra versión. Mejor fallar antes de construir.
      - name: Revisar que la etiqueta coincida con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de package.json. Sube la versión, haz commit y vuelve a crear la etiqueta."
            exit 1
          fi

      # electron-builder sube varios archivos a la vez y, si el release no existe, cada subida intenta crearlo y una falla con
      # "422 Published releases must have a valid tag". Creándolo antes, las subidas solo agregan archivos.
      - name: Crear el release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --repo Heutlett/easy-tools-releases >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo Heutlett/easy-tools-releases --title "${GITHUB_REF_NAME#v}" --notes "Easy Tools ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      # Al subir una etiqueta (por ejemplo v0.2.0) se construye y se PUBLICA la versión para que las apps instaladas
      # se actualicen. Necesita el secreto RELEASES_TOKEN (ver README).
      - name: Construir y publicar
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      # Sin etiqueta solo se construye el instalador (para probarlo), sin publicar nada
      - name: Construir sin publicar
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: easy-tools-windows
          path: |
            dist/*.exe
            dist/latest.yml
