name: Instalador de Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Al subir una etiqueta (por ejemplo v0.2.0) se construye y se PUBLICA la versión para que las apps instaladas
      # se actualicen. Necesita el secreto RELEASES_TOKEN (ver README).
      - name: Construir y publicar
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      # Sin etiqueta solo se construye el instalador (para probarlo), sin publicar nada
      - name: Construir sin publicar
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: easy-tools-windows
          path: |
            dist/*.exe
            dist/latest.yml
